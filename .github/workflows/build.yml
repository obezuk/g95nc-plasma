name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path('plasma/com.obezuk.g95nc/metadata.json').read_text())
          expected = 'v' + metadata['KPlugin']['Version']
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must match metadata.json: {expected}')
          PY
      - name: Test layout, protocol, packaging, and transport
        run: |
          node tests/test_plasma_layout.cjs
          node tests/test_plasma_protocol.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          bash -n plasma/com.obezuk.g95nc/contents/code/transport.sh
      - name: Build package
        run: python3 deploy/build-plasma.py
      - name: Checksum
        working-directory: dist
        run: sha256sum g95nc-control.plasmoid > SHA256SUMS
      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: g95nc-control
          path: |
            dist/g95nc-control.plasmoid
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: g95nc-control
          path: dist
      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/g95nc-control.plasmoid dist/SHA256SUMS \
            --verify-tag --generate-notes --title "G95NC Control $RELEASE_TAG"
